# Prüft die Signatur-Secrets, ohne ein APK zu bauen (ca. 1 Minute):
# alle vier vorhanden, Keystore lesbar, Alias vorhanden, Schlüssel-Passwort passt
# (Probesignatur einer Dummy-JAR mit jarsigner). Gibt den SHA-256-Fingerabdruck
# des Zertifikats aus. Läuft bei Änderungen an dieser Datei und manuell.
name: keystore-check

on:
  push:
    paths:
      - '.github/workflows/keystore-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '20'

      - name: Secrets prüfen
        env:
          KEYSTORE_BASE64: ${{ secrets.TILES_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TILES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TILES_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TILES_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing TILES_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing TILES_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing TILES_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing TILES_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende oder leere Secrets:$missing"
            exit 1
          fi
          echo "✓ Alle vier Secrets vorhanden."

          KS="$RUNNER_TEMP/check.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KS" 2>/dev/null; then
            echo "::error::TILES_KEYSTORE_BASE64 ist kein gültiges Base64."
            exit 1
          fi
          echo "✓ Base64 dekodiert ($(stat -c %s "$KS") Byte)."

          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Keystore lässt sich mit TILES_KEYSTORE_PASSWORD nicht öffnen (falsches Passwort oder beschädigte Datei)."
            exit 1
          fi
          echo "✓ Keystore-Passwort passt."

          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Alias aus TILES_KEY_ALIAS nicht im Keystore. Vorhandene Aliase:"
            keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i 'PrivateKeyEntry' | cut -d, -f1
            exit 1
          fi
          echo "✓ Alias vorhanden."

          # Probesignatur: benutzt das Schlüssel-Passwort genau wie der Gradle-Build.
          mkdir -p "$RUNNER_TEMP/jar" && echo test > "$RUNNER_TEMP/jar/test.txt"
          (cd "$RUNNER_TEMP/jar" && jar cf ../probe.jar test.txt)
          if ! jarsigner -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              "$RUNNER_TEMP/probe.jar" "$KEY_ALIAS" > "$RUNNER_TEMP/sign.log" 2>&1; then
            echo "::error::Probesignatur fehlgeschlagen – TILES_KEY_PASSWORD passt vermutlich nicht (muss dem Keystore-Passwort entsprechen)."
            sed 's/^/    /' "$RUNNER_TEMP/sign.log" | grep -iv password || true
            exit 1
          fi
          echo "✓ Probesignatur erfolgreich, Schlüssel-Passwort passt."

          echo ""
          echo "Zertifikat:"
          keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E '^(Owner|Eigentümer|Valid|Gültig|[[:space:]]*SHA256:)' | sed 's/^[[:space:]]*//'
          FP="$(keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p')"
          echo "### Signaturschlüssel geprüft ✓" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$FP\`" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$KS"
