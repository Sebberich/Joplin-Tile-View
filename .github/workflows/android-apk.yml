# Baut das Android-APK (Release-Variante, mit Debug-Keystore signiert) aus dem
# Submodule joplin/ plus patches/. Orientiert sich an joplin/.github/workflows/build-android.yml.
# Läuft bei jedem Push und manuell (workflow_dispatch). Das APK liegt danach als
# Artefakt "joplin-tile-view-apk" am Workflow-Lauf und als GitHub-Release
# "v<Joplin-Version>-tiles.<Build-Nr>" (Quelle für Obtainium).
name: android-apk

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/keystore-check.yml'
      - 'README.md'
      - 'patches/README.md'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Formel-Tabellen-Plugin (plugins/formula-tables): Tests, Build der .jpl, hängt am Release.
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/formula-tables
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/formula-tables/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: formula-tables-plugin
          path: plugins/formula-tables/publish/*.jpl
          if-no-files-found: error
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: plugin
    outputs:
      version: ${{ steps.version.outputs.version }}
      keystore_available: ${{ steps.keystore.outputs.available }}
      keystore_fingerprint: ${{ steps.keystore.outputs.fingerprint }}
    steps:
      - name: Linux-Abhängigkeiten
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libsecret-1-dev

      # Wie in Joplins CI: Platz freimachen, die NDK-/OpenSSL-Transforms brauchen 20 GB+.
      - name: Plattenplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell || true
          docker system prune -af || true
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '20'

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: joplin/yarn.lock

      - name: Yarn über Corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          COREPACK_NETWORK_TIMEOUT: '60000'
        run: |
          corepack enable
          cd joplin
          for i in 1 2 3; do
            corepack prepare --activate && break
            echo "corepack prepare fehlgeschlagen (Versuch $i), neuer Versuch in 15s..."
            sleep 15
          done
          yarn --version

      # Gradle-Abhängigkeiten und NDK zwischen Läufen behalten (halbiert Folgeläufe).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('joplin/packages/app-mobile/android/**/*.gradle', 'joplin/packages/app-mobile/android/gradle/wrapper/gradle-wrapper.properties', 'joplin/yarn.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Patches anwenden
        run: scripts/apply-patches.sh

      - name: yarn install
        env:
          SKIP_ONENOTE_CONVERTER_BUILD: 1
          # Wir bauen nur Android. yarn install zieht im Monorepo trotzdem app-desktop hoch und
          # lädt dafür das Electron-Binary von GitHub Releases – überflüssig und eine
          # Fehlerquelle (Lauf #14 scheiterte an einem HTTP 500 dieses Downloads).
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          source joplin/.github/scripts/retry.sh
          cd joplin
          retry yarn install

      # Eigener Keystore aus den Repo-Secrets. Benutzt wird er erst, wenn die Repo-Variable
      # TILES_USE_RELEASE_KEYSTORE auf "true" steht: Der Wechsel vom Debug- zum eigenen Schlüssel
      # erzwingt eine Neuinstallation, soll also bewusst geschaltet werden. Solange der Schalter aus
      # ist, wird ein vorhandener Keystore nur geprüft (Alias, Passwörter) und sein Fingerabdruck
      # ausgegeben, damit die Einrichtung vorab kontrolliert werden kann.
      - name: Keystore aus Secrets bereitstellen
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TILES_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TILES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TILES_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TILES_KEY_PASSWORD }}
          USE_RELEASE_KEYSTORE: ${{ vars.TILES_USE_RELEASE_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret TILES_KEYSTORE_BASE64 fehlt – Build mit Debug-Keystore."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/tiles.keystore"
          # Prüfen: Keystore lesbar, Passwort stimmt, Alias vorhanden. (Das Schlüssel-Passwort lässt sich
          # bei PKCS12-Keystores nicht getrennt prüfen; es muss dem Keystore-Passwort entsprechen.)
          if ! keytool -list -keystore "$RUNNER_TEMP/tiles.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore-Secrets passen nicht zusammen (Datei, Keystore-Passwort oder Alias falsch)."
            exit 1
          fi
          FINGERPRINT="$(keytool -list -v -keystore "$RUNNER_TEMP/tiles.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p')"
          echo "Keystore geprüft. Zertifikat SHA-256: $FINGERPRINT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          if [ "$USE_RELEASE_KEYSTORE" != "true" ]; then
            echo "::notice::Eigener Keystore ist eingerichtet und geprüft, aber noch nicht aktiv (Repo-Variable TILES_USE_RELEASE_KEYSTORE != true) – Build mit Debug-Keystore."
            rm -f "$RUNNER_TEMP/tiles.keystore"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Android-APK bauen
        env:
          TILE_VIEW_BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_AVAILABLE: ${{ steps.keystore.outputs.available }}
          TILES_KEYSTORE_PASSWORD: ${{ secrets.TILES_KEYSTORE_PASSWORD }}
          TILES_KEY_ALIAS: ${{ secrets.TILES_KEY_ALIAS }}
          TILES_KEY_PASSWORD: ${{ secrets.TILES_KEY_PASSWORD }}
        run: |
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then
            export JOPLIN_RELEASE_STORE_FILE="$RUNNER_TEMP/tiles.keystore"
            export JOPLIN_RELEASE_STORE_PASSWORD="$TILES_KEYSTORE_PASSWORD"
            export JOPLIN_RELEASE_KEY_ALIAS="$TILES_KEY_ALIAS"
            export JOPLIN_RELEASE_KEY_PASSWORD="$TILES_KEY_PASSWORD"
          fi
          scripts/build-android.sh release

      - name: 16-KB-Alignment prüfen
        run: |
          APK=joplin/packages/app-mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -n1)"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tail -n 3

      # Version für das Release (und den Release-Job): Basis aus dem gepatchten build.gradle.
      - name: Version ermitteln
        id: version
        run: |
          BASE="$(sed -n 's/.*versionName tileViewBuildNumber > 0 ? "\([0-9.]*\)-tiles.*/\1/p' joplin/packages/app-mobile/android/app/build.gradle)"
          VERSION="${BASE}-tiles.${{ github.run_number }}"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: joplin-tile-view-apk
          path: joplin/packages/app-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # App-Smoke-Test im Android-Emulator (Maestro-Flows in .maestro/, Ablauf in scripts/smoke-test.sh).
  # Solange die Repo-Variable SMOKE_TEST_REQUIRED nicht "true" ist, darf der Job fehlschlagen,
  # ohne das Release zu blockieren (continue-on-error am Job: needs.smoke-test.result ist dann "success").
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    continue-on-error: ${{ vars.SMOKE_TEST_REQUIRED != 'true' }}
    steps:
      - uses: actions/checkout@v6   # ohne Submodule: nur .maestro/ und scripts/ werden gebraucht

      - uses: actions/download-artifact@v4
        with:
          name: joplin-tile-view-apk
          path: apk

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # KVM auf ubuntu-latest freischalten (Vorgehen aus der Doku von android-emulator-runner).
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro installieren
        env:
          MAESTRO_VERSION: '2.0.10'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Emulator starten, APK installieren, Maestro-Flows ausführen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_RESULTS_DIR: ${{ github.workspace }}/smoke-test-results
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/smoke-test.sh apk/app-release.apk

      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: smoke-test-results
          if-no-files-found: warn
          retention-days: 14

  # GitHub-Release (Quelle für Obtainium). Läuft nur bei Push und nur, wenn Build und Plugin
  # erfolgreich waren. Der Smoke-Test muss nur dann bestehen, wenn SMOKE_TEST_REQUIRED == "true";
  # !cancelled() verhindert, dass ein (mit continue-on-error tolerierter) Smoke-Test-Fehler
  # den Job über den impliziten success()-Check überspringt.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, smoke-test, plugin]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push'
      && needs.build.result == 'success'
      && needs.plugin.result == 'success'
      && (needs.smoke-test.result == 'success' || vars.SMOKE_TEST_REQUIRED != 'true') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: joplin-tile-view-apk
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: formula-tables-plugin
          path: plugin-release

      - name: GitHub-Release anlegen (Quelle für Obtainium)
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_AVAILABLE: ${{ needs.build.outputs.keystore_available }}
          KEYSTORE_FINGERPRINT: ${{ needs.build.outputs.keystore_fingerprint }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then SIG="project keystore (SHA-256 ${KEYSTORE_FINGERPRINT})"; else SIG="debug keystore (test phase, reinstall required when switching to the project keystore)"; fi
          APK=apk/app-release.apk
          cp "$APK" "joplin-tiles-${VERSION}.apk"
          DISCLAIMER="Vibe-coded: the code is mostly written by an AI assistant (Claude Code) and has not been reviewed line by line by hand. Private hobby project in the test phase, no warranty and no liability. Back up your data before using this with real notes (JEX export)."
          PLUGIN="$(ls plugin-release/*.jpl | head -n1)"
          NOTES="$(printf '%s\n\n%s\n\n%s\n' "Build #${{ github.run_number }} from ${GITHUB_SHA::7}. Signature: ${SIG}. Installable as an update over builds with the same signature." "Also attached: the Formula Tables plugin (\`$(basename "$PLUGIN")\`) – install it in Joplin via Settings → Plugins → Install from file. See plugins/formula-tables/README.md." "⚠️ **${DISCLAIMER}**")"
          gh release create "v${VERSION}" "joplin-tiles-${VERSION}.apk" "$PLUGIN" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Joplin Tiles Beta ${VERSION}" \
            --notes "$NOTES"
